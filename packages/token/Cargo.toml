[package]
name = "mienai-tusd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "tUSD: a test NEP-141 token (6 decimals) for Mienai's testnet pool. Not money."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0-rc.1"
near-contract-standards = "=5.30.0-rc.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
