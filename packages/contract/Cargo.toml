[package]
name = "mienai"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mienai vault: sealed stop-loss / take-profit orders fired only by an attested OutLayer enclave"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0-rc.1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.30.0-rc.1", features = ["unit-testing"] }
near-workspaces = "=0.24.0-rc.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde_json = "1"
ed25519-dalek = "2"
borsh = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
