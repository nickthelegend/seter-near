[package]
name = "mienai-enclave"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mienai trigger enclave: decrypts sealed stop/take-profit orders inside OutLayer (Intel TDX), reads a public NEAR/USD price and signs a fire report"

[[bin]]
name = "mienai-enclave"
path = "src/main.rs"

[features]
direct-probe = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "0.2"
wit-bindgen = "0.36"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
